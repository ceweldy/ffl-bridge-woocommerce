name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP ${{ matrix.php }} quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.3'
          - '8.4'
          - '8.5'

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install development dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction

      - name: Run lint, coding standards, and PHPUnit
        run: composer check

      - name: Check JavaScript syntax
        run: find assets/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate release script syntax
        run: bash -n bin/build-release.sh

  package:
    name: Reproducible release package
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build release archive
        run: bin/build-release.sh

      - name: Verify archive and exclusions
        shell: bash
        run: |
          artifact="$(find dist -maxdepth 1 -type f -name 'ffl-bridge-for-woocommerce-*.zip' -print -quit)"
          test -n "${artifact}"
          unzip -t "${artifact}"
          if unzip -Z1 "${artifact}" | grep -E '(^|/)(\.distignore|\.git|\.github|bin|tests|vendor|composer\.(json|lock)|php(cs|unit)\.xml\.dist|CHANGELOG\.md|CONTRIBUTING\.md|README\.md|SECURITY\.md)(/|$)'; then
            echo 'Release archive contains a development-only path.' >&2
            exit 1
          fi
